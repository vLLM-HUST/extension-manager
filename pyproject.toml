[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-hust-ext"
version = "0.1.0"
description = "Extension discovery and activation manager for the vLLM-HUST ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "vLLM-HUST"}]
dependencies = [
  "packaging>=24.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
vllm-hust-ext = "vllm_hust_ext.cli:main"

[project.urls]
Repository = "https://github.com/vLLM-HUST/extension-manager"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
