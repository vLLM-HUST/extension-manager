name: H3 source style candidate

on:
  pull_request:
    paths:
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/h3-source-style-candidate.yml'

permissions:
  contents: read

concurrency:
  group: h3-source-style-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-style-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.1
      - name: Produce canonical patch without publishing it
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          base = "dc3b2dc3d73a603427f87db7a69f8206efb438d2"
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", base, "HEAD"],
              text=True,
          ).splitlines()
          paths = [
              p for p in paths
              if p.endswith(".py")
              and not p.startswith("experiments/native_attention_candidate/source/")
          ]
          identities = {
              p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
              for p in paths
          }
          if not paths:
              raise SystemExit("No source candidate paths selected")
          print("ECPA_SOURCE_STYLE_INPUTS", json.dumps(identities, sort_keys=True), flush=True)
          first = subprocess.run(["python", "-m", "ruff", "check", "--fix", *paths])
          formatted = subprocess.run(["python", "-m", "ruff", "format", *paths])
          final = subprocess.run(["python", "-m", "ruff", "check", *paths])
          print("ECPA_SOURCE_STYLE_RESULTS", first.returncode, formatted.returncode, final.returncode, flush=True)
          print("ECPA_SOURCE_STYLE_DIFF_BEGIN", flush=True)
          subprocess.run(["git", "diff", "--no-color", "--no-ext-diff"], check=True)
          print("ECPA_SOURCE_STYLE_DIFF_END", flush=True)
          pathlib.Path("h3-source-style-candidate.patch").write_bytes(
              subprocess.check_output(["git", "diff", "--no-color", "--no-ext-diff"])
          )
          pathlib.Path("h3-source-style-inputs.json").write_text(json.dumps(identities, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-source-style-candidate
          path: |
            h3-source-style-candidate.patch
            h3-source-style-inputs.json
          if-no-files-found: error
