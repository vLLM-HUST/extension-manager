name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VLLM_HUST_BENCHMARK_ORIGINALS: /tmp/benchmark-originals
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python scripts/fetch_benchmark_originals.py "$VLLM_HUST_BENCHMARK_ORIGINALS"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python scripts/check_release_readiness.py
      - run: python scripts/check_manifest_03_conformance.py
      - run: python scripts/check_failure_permission_matrix.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify clean wheel installation
        run: |
          python -m venv /tmp/vllm-hust-ext-wheel
          /tmp/vllm-hust-ext-wheel/bin/pip install dist/*.whl
          /tmp/vllm-hust-ext-wheel/bin/vllm-hust-ext --help
          /tmp/vllm-hust-ext-wheel/bin/vllm-hust-ext --version | grep -Fx 'vllm-hust-ext 0.3.0'
