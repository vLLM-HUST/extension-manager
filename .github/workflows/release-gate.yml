name: Release Gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - name: Require an authorized release decision
        run: python scripts/check_release_readiness.py --require-authorized
      - name: Require the tag to equal the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from vllm_hust_ext import __version__

          expected = f"v{__version__}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          PY
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build
      - name: Verify clean wheel installation
        run: |
          python -m venv /tmp/vllm-hust-ext-release-wheel
          /tmp/vllm-hust-ext-release-wheel/bin/pip install dist/*.whl
          /tmp/vllm-hust-ext-release-wheel/bin/vllm-hust-ext --version
          /tmp/vllm-hust-ext-release-wheel/bin/vllm-hust-ext --help
      - uses: actions/upload-artifact@v4
        with:
          name: vllm-hust-ext-${{ github.ref_name }}
          path: dist/*
