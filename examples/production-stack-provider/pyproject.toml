[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-hust-production-stack-provider"
version = "0.2.0.dev0"
description = "Experimental Production Stack host profile for vLLM-HUST"
requires-python = ">=3.10"
dependencies = ["vllm-hust-ext==0.2.0.dev0"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.production-stack-provider" = "vllm_hust_production_stack_provider.manifests"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_hust_production_stack_provider"]

[tool.hatch.build.targets.wheel.force-include]
"src/vllm_hust_production_stack_provider/manifests/vllm-hust-extension-v0.2.json" = "vllm_hust_production_stack_provider/manifests/vllm-hust-extension-v0.2.json"
