[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-hust-lmcache-provider"
version = "0.2.0.dev0"
description = "Experimental LMCache host profile for vLLM-HUST Extension Manager"
requires-python = ">=3.10"

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.lmcache-provider" = "vllm_hust_lmcache_provider.manifests"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_hust_lmcache_provider"]

[tool.hatch.build.targets.wheel.force-include]
"src/vllm_hust_lmcache_provider/manifests/vllm-hust-extension-v0.2.json" = "vllm_hust_lmcache_provider/manifests/vllm-hust-extension-v0.2.json"
