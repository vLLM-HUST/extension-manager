[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-hust-lmcache-ascend-adapter"
version = "0.2.0.dev0"
description = "Experimental LMCache-Ascend vLLM adapter profile"
requires-python = ">=3.10,<3.13"
dependencies = ["vllm-hust-ext==0.2.0.dev0"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.lmcache-ascend-vllm-adapter" = "vllm_hust_lmcache_ascend_adapter.manifests"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_hust_lmcache_ascend_adapter"]

[tool.hatch.build.targets.wheel.force-include]
"src/vllm_hust_lmcache_ascend_adapter/manifests/vllm-hust-extension-v0.2.json" = "vllm_hust_lmcache_ascend_adapter/manifests/vllm-hust-extension-v0.2.json"
